<!doctype html>
<!--
  Stringless example: wet-ink save. Strangeness 3.
  What is it?            A rocker blotter on a desk, next to a written page.
  What does it touch?    The page. Only paragraphs changed since the last save are wet ink.
  What will it do?       On approach it rocks toward the page, and the start of every wet line dries
                         matte: a preview of the blot. Saving rocks it across, drying the ink under it.
  What does it cost?     Light. One press. Ctrl/Cmd+S does the same.
  Where is it in time?   Wet ink = unsaved. Dry, matte ink = saved. The felt keeps a mirrored
                         imprint of what was last blotted: proof of the save.
  Lexicon: ink wet/dry = unsaved/saved; blotter = save; felt imprint = last save.
  Reduced motion: the blotter settles in place and the ink dries without travel.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wet-ink save · Stringless</title>
<link rel="stylesheet" href="../runtime/stringless.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(700px circle at var(--sl-px, 40%) var(--sl-py, 30%), rgb(255 228 170 / .09), transparent 60%),
      radial-gradient(120% 90% at 50% 40%, transparent 40%, rgb(0 0 0 / .55)),
      var(--sl-grain),
      #22392f;
    background-blend-mode: normal, normal, soft-light, normal;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  .desk {
    position: relative;
    display: grid;
    grid-template-columns: auto auto;
    align-items: end;
    gap: clamp(16px, 4vw, 44px);
    padding: 24px;
  }
  .page {
    position: relative;
    width: min(500px, 76vw);
    min-height: 360px;
    padding: 46px 52px 54px;
    border-radius: 3px;
    rotate: -1.2deg;
  }
  .writing {
    outline: none;
    font-size: clamp(17px, 2.2vw, 20px);
    line-height: 1.65;
    caret-color: #12307a;
  }
  .writing p {
    position: relative;
    margin: 0 0 .85em;
    color: #2b2f38;
    transition: color 1.1s ease-out, text-shadow 1.1s ease-out;
  }
  .writing p[data-wet] {
    color: #12307a;
    text-shadow: 0 0 .6px rgb(20 50 150 / .7), 0 .6px 1.2px rgb(10 30 100 / .25);
    transition: text-shadow .15s ease-out;
  }
  /* Drying shows where it happens: a matte front crosses the wet lines. Hovering or focusing the
     blotter dries the start of each line (the rehearsal); the save carries the front with the blotter. */
  @property --dry { syntax: '<number>'; inherits: false; initial-value: 0; }
  .page[data-sl-preview="save"] .writing p[data-wet] { --dry: calc(var(--sl-rehearse) * .3); }
  .page[data-sl-preview="save"] .writing p[data-wet], .writing p[data-drying] {
    color: transparent;
    text-shadow: none;
    transition: none;
    background: linear-gradient(90deg, #2b2f38 calc(var(--dry) * 100% - 4%), #12307a calc(var(--dry) * 100% + 4%));
    -webkit-background-clip: text;
    background-clip: text;
  }

  /* The sheen: a light that only brightens pixels darker than itself, so it lands on ink, never on paper. */
  /* The sheen follows the pointer. .writing gets --sl-px and --sl-py, which don't inherit on their own. */
  .writing p, .writing p::after { --sl-px: inherit; --sl-py: inherit; }
  .writing p::after {
    content: '';
    position: absolute;
    inset: -3px -6px;
    pointer-events: none;
    background:
      radial-gradient(circle 150px at var(--sl-px, -999px) var(--sl-py, -999px), rgb(150 178 240 / .95), transparent 72%) fixed,
      linear-gradient(100deg, transparent 20%, rgb(105 135 215 / .55) 42%, transparent 64%);
    mix-blend-mode: lighten;
    opacity: 0;
    transition: opacity 1.1s ease-out;
  }
  .writing p[data-wet]::after { opacity: .75; transition-duration: .2s; }
  .page[data-sl-preview="save"] .writing p[data-wet]::after { opacity: calc(.75 + var(--sl-rehearse) * .25); }
  /* Drying ink loses its sheen, so only the ink color shows where the front is. */
  .page .writing p[data-wet][data-drying]::after { opacity: 0; transition: opacity .25s ease-out; }

  /* The blotter */
  .blotter {
    all: unset;
    position: relative;
    display: grid;
    justify-items: center;
    width: 140px;
    padding: 6px 6px 0;
    cursor: pointer;
    transform-origin: 50% 100%;
    rotate: calc(var(--sl-near) * -7deg * var(--sl-intensity) * var(--sl-motion));
    transition: rotate .35s var(--sl-ease-paper);
    -webkit-tap-highlight-color: transparent;
  }
  .blotter:focus-visible { outline: 2px solid #f2d18b; outline-offset: 6px; border-radius: 10px; }
  .knob {
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, #c99a6b, #7a4a27 60%, #4a2a14);
    box-shadow: 0 2px 3px rgb(0 0 0 / .4), inset 0 1px 1px rgb(255 230 200 / .35);
    margin-bottom: -4px;
  }
  .stem { width: 10px; height: 14px; background: linear-gradient(90deg, #5a3519, #8a5a33, #5a3519); }
  .plate {
    width: 132px; height: 14px; border-radius: 4px;
    background: repeating-linear-gradient(92deg, rgb(0 0 0 / .08) 0 2px, transparent 2px 7px), linear-gradient(180deg, #9a6a3f, #6b4223);
    box-shadow: inset 0 1px 0 rgb(255 220 180 / .3), 0 2px 4px rgb(0 0 0 / .35);
    position: relative; z-index: 1;
  }
  .felt {
    position: relative;
    width: 124px; height: 34px;
    margin-top: -2px;
    border-radius: 0 0 62px 62px / 0 0 30px 30px;
    background: radial-gradient(120% 100% at 50% 0%, #f7eff0, #e9d6d8 70%), var(--sl-grain);
    background-blend-mode: multiply;
    box-shadow: inset 0 -3px 6px rgb(120 60 70 / .18), 0 calc(4px + var(--sl-near) * 4px) 10px rgb(0 0 0 / .35);
    overflow: hidden;
  }
  .imprint {
    position: absolute; inset: 6px 10px auto;
    font-size: 7px; line-height: 1.3;
    color: rgb(30 55 140 / .32);
    scale: -1 1;
    white-space: nowrap; overflow: hidden; text-overflow: clip;
    filter: blur(.25px);
    transition: opacity .6s;
  }
  @media (max-width: 640px) {
    body { overflow: auto; place-items: start center; }
    .desk { grid-template-columns: 1fr; justify-items: center; padding: 20px 12px 28px; }
    .page { min-height: 0; padding: 26px 22px 34px; }
    .writing { font-size: 16.5px; }
    /* The blotter rests on the page's lower corner, within thumb reach. */
    .blotter { justify-self: end; margin: -46px 6px 0 0; }
  }
</style>
</head>
<body data-sl-pointer>
<main class="desk">
  <article class="page" data-sl-material="paper" data-sl-phase="wet">
    <div class="writing" data-sl-pointer contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note" spellcheck="false">
      <p>Saturday market.</p>
      <p>Pears, the hard green ones. Two loaves from the stall by the fountain, and whatever cheese the old man is pushing this week.</p>
      <p data-wet>Ask again about the walnut honey. Last time he said the bees had moved.</p>
    </div>
  </article>
  <button class="blotter" type="button" data-sl-verb="save" data-sl-target=".page" aria-label="Save note">
    <span class="knob" aria-hidden="true"></span>
    <span class="stem" aria-hidden="true"></span>
    <span class="plate" aria-hidden="true"></span>
    <span class="felt" aria-hidden="true"><span class="imprint"></span></span>
  </button>
</main>

<script src="../runtime/stringless.js"></script>
<script>
  const page = document.querySelector('.page');
  const writing = page.querySelector('.writing');
  const blotter = document.querySelector('.blotter');
  const imprint = blotter.querySelector('.imprint');
  let busy = false;

  const wetParagraphs = () => [...writing.querySelectorAll('p[data-wet]')];
  const syncPhase = () => Stringless.phase(page, wetParagraphs().length ? 'wet' : 'dry');

  // Mark the paragraph under the caret as wet: only what changed since the last save glistens.
  writing.addEventListener('input', () => {
    const sel = getSelection();
    let node = sel && sel.anchorNode;
    if (node && node.nodeType === 3) node = node.parentElement;
    let p = node && node.closest ? node.closest('p') : null;
    if (!p || !writing.contains(p)) {
      // Typing into a bare text node: wrap it so it can carry its own wetness.
      p = writing.querySelector('p:last-of-type');
    }
    if (p) p.setAttribute('data-wet', '');
    syncPhase();
  });

  addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); blotter.click(); }
  });

  blotter.addEventListener('click', async () => {
    if (busy) return;
    const wet = wetParagraphs();
    if (!wet.length) { Stringless.verbs.settle(blotter); Stringless.announce('Nothing new to save.'); return; }
    busy = true;
    if (Stringless.reducedMotion) {
      wet.forEach((p) => p.removeAttribute('data-wet'));
      await Stringless.verbs.settle(blotter);
    } else {
      await rockAcross(wet);
    }
    imprint.textContent = wet.map((p) => p.textContent.trim()).join('  ');
    syncPhase();
    Stringless.announce('Saved.');
    busy = false;
  });

  async function rockAcross(paragraphs) {
    const b = blotter.getBoundingClientRect();
    // Each segment eases on its own (overall easing is linear), so a paragraph's drying can follow its leg exactly.
    const frames = [{ transform: 'translate(0px, 0px) rotate(0deg)', offset: 0, easing: 'ease-in-out' }];
    const legs = [];
    for (const p of paragraphs) {
      const r = p.getBoundingClientRect();
      const y = r.top + Math.min(r.height, 60) * 0.7 - b.bottom;
      legs.push({ p, from: r.left + 50 - (b.left + b.width / 2), to: r.right - 50 - (b.left + b.width / 2), y });
    }
    const total = 1 + legs.length * 2 + 1;
    let i = 1;
    for (const leg of legs) {
      frames.push({ transform: `translate(${leg.from}px, ${leg.y}px) rotate(-11deg)`, offset: i++ / total, easing: 'ease-in-out' });
      frames.push({ transform: `translate(${leg.to}px, ${leg.y}px) rotate(11deg)`, offset: i++ / total, easing: 'ease-in-out' });
    }
    frames.push({ transform: 'translate(0px, 0px) rotate(0deg)', offset: 1 });
    const duration = 380 + legs.length * 760 + 420;
    const anim = blotter.animate(frames, { duration, easing: 'linear' });
    // The ink dries under the felt as it passes: the front starts where the rehearsal left it.
    const drying = legs.map((leg, k) => {
      const s = (1 + 2 * k) / total;
      const e = (2 + 2 * k) / total;
      const from = parseFloat(getComputedStyle(leg.p).getPropertyValue('--dry')) || 0;
      leg.p.setAttribute('data-drying', '');
      const a = leg.p.animate([{ '--dry': from }, { '--dry': 1.1 }], { duration: (e - s) * duration, delay: s * duration, easing: 'ease-in-out', fill: 'both' });
      return a.finished.catch(() => null).then(() => {
        // Swap the painted front for plain dry ink with no fade, so nothing flickers.
        leg.p.style.transition = 'none';
        leg.p.removeAttribute('data-wet');
        leg.p.removeAttribute('data-drying');
        a.cancel();
        void leg.p.offsetWidth;
        leg.p.style.transition = '';
      });
    });
    await Promise.all([anim.finished.catch(() => null), ...drying]);
  }
</script>
</body>
</html>
