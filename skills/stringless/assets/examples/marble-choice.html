<!doctype html>
<!--
  Stringless example: one marble, three wells. Single choice. Strangeness 3.
  What is it?            A wooden tray with three carved wells and one glass marble.
                         There is only one marble, so only one option can be chosen.
  What does it touch?    The order: the chosen well sets the shipping line and the total.
  What will it do?       Hovering or focusing another well tips the tray toward it and the marble
                         starts to roll that way, then settles back if you leave.
  What does it cost?     Light. Click, tap, or arrow keys (native radio buttons underneath).
  Where is it in time?   The marble rests where the choice is. The well it left keeps a faint
                         dust ring for a moment.
  Lexicon: marble = the current choice; wells = options; one marble = one choice.
  Reduced motion: the marble appears in the new well with a short glint, no rolling.
  Option names, times and prices stay as text: they are content.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble choice · Stringless</title>
<link rel="stylesheet" href="../runtime/stringless.css">
<style>
  :root { color-scheme: light; --wood: #b07a4a; --wood-dk: #7a4e2b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(900px circle at var(--sl-px, 50%) var(--sl-py, 10%), rgb(255 250 240 / .5), transparent 60%),
      var(--sl-grain),
      #e8e1d6;
    background-blend-mode: normal, multiply, normal;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: #2d2924;
  }
  .order { width: min(640px, 92vw); display: grid; gap: 22px; }
  .order h1 { margin: 0; font: 600 clamp(22px, 3vw, 28px)/1.2 "Iowan Old Style", Palatino, Georgia, serif; }

  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .tray {
    --tilt: 0;
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: 26px 20px 22px;
    border-radius: 999px;
    background:
      radial-gradient(120% 90% at calc(var(--sl-lx, 40) * 1%) calc(var(--sl-ly, 10) * 1%), rgb(255 230 200 / .35), transparent 60%),
      repeating-linear-gradient(92deg, rgb(60 30 10 / .1) 0 1px, transparent 1px 9px),
      repeating-linear-gradient(88deg, rgb(255 220 180 / .08) 0 2px, transparent 2px 17px),
      linear-gradient(180deg, var(--wood), var(--wood-dk));
    box-shadow:
      inset 0 2px 0 rgb(255 220 180 / .35),
      inset 0 -3px 0 rgb(40 20 5 / .35),
      0 calc(10px - var(--tilt) * 0px) 24px -8px rgb(60 35 15 / .55);
    rotate: calc(var(--tilt) * 1.4deg * var(--sl-intensity) * var(--sl-motion));
    transition: rotate .5s var(--sl-ease-wax);
  }
  .well-wrap { position: relative; display: grid; justify-items: center; }
  .well {
    position: relative;
    display: grid;
    place-items: center;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    cursor: pointer;
    background:
      radial-gradient(circle at 50% 38%, rgb(30 12 2 / .55), rgb(30 12 2 / .2) 55%, transparent 72%),
      radial-gradient(circle at 50% 50%, #6b4122, #8e5b33 70%);
    box-shadow:
      inset 0 6px 10px rgb(20 8 0 / .55),
      inset 0 -2px 3px rgb(255 210 160 / .3),
      0 1px 0 rgb(255 220 180 / .35);
    -webkit-tap-highlight-color: transparent;
  }
  .well::after {
    /* the light on the rim brightens as the pointer nears */
    content: '';
    position: absolute; inset: -3px;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgb(255 226 180 / calc(var(--sl-near) * .5));
    pointer-events: none;
  }
  .well input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .well:has(input:focus-visible) { outline: 2px solid #1f5fbf; outline-offset: 6px; }
  .dust {
    position: absolute; inset: 14px;
    border-radius: 50%;
    border: 2px dotted rgb(255 230 200 / 0);
    transition: border-color 1.6s ease-out;
    pointer-events: none;
  }
  .well-wrap[data-left] .dust { border-color: rgb(255 230 200 / .35); transition-duration: .05s; }

  .marble {
    position: absolute;
    left: 0; top: 0;
    width: 46px; height: 46px;
    margin: -23px 0 0 -23px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
    background:
      radial-gradient(circle at calc(30% + (var(--sl-lx, 30) - 30) * .1%) calc(28% + (var(--sl-ly, 20) - 20) * .1%), rgb(255 255 255 / .95) 0 6%, rgb(255 255 255 / .2) 18%, transparent 30%),
      radial-gradient(circle at 65% 75%, rgb(255 255 255 / .25), transparent 40%),
      radial-gradient(circle at 50% 50%, rgb(120 200 230 / .35), rgb(20 70 110 / .75) 80%, rgb(10 30 60 / .95));
    box-shadow: inset -4px -6px 10px rgb(0 20 50 / .45), 0 6px 8px -2px rgb(20 10 0 / .55);
  }
  .swirl {
    position: absolute; inset: 6px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 12%, #ff7a3c 14% 22%, transparent 24% 46%, #ffd447 48% 55%, transparent 57% 78%, #ff4d6d 80% 88%, transparent 90%);
    filter: blur(1.5px);
    opacity: .8;
    mix-blend-mode: screen;
  }
  .options { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin-top: 12px; }
  .opt { display: grid; gap: 2px; font-size: 14px; color: #5b544b; transition: color .3s; }
  .opt b { font-size: 16px; color: #2d2924; font-weight: 500; }
  .opt[data-on] { color: #2d2924; }
  .opt[data-on] b { font-weight: 700; }

  .totals { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 15px; font-variant-numeric: tabular-nums; }
  .totals .sum { font-weight: 700; font-size: 18px; padding-top: 8px; border-top: 1px solid rgb(60 40 20 / .2); }
  .totals .sum + .sum { text-align: right; }

  @media (max-width: 520px) {
    .well { width: 62px; height: 62px; }
    .marble { width: 38px; height: 38px; margin: -19px 0 0 -19px; }
    .opt { font-size: 13px; }
  }
</style>
</head>
<body>
<main class="order">
  <h1>Your order</h1>
  <fieldset>
    <legend>Shipping speed</legend>
    <div class="tray" data-sl-material="wood">
      <div class="well-wrap">
        <label class="well" data-sl-verb="choose" data-sl-target=".tray" data-sl-radius="60">
          <input type="radio" name="ship" value="0" data-days="5 to 7 days" aria-label="Standard, 5 to 7 days, free" checked>
          <span class="dust" aria-hidden="true"></span>
        </label>
      </div>
      <div class="well-wrap">
        <label class="well" data-sl-verb="choose" data-sl-target=".tray" data-sl-radius="60">
          <input type="radio" name="ship" value="9" aria-label="Express, 2 days, 9 dollars">
          <span class="dust" aria-hidden="true"></span>
        </label>
      </div>
      <div class="well-wrap">
        <label class="well" data-sl-verb="choose" data-sl-target=".tray" data-sl-radius="60">
          <input type="radio" name="ship" value="24" aria-label="Overnight, tomorrow, 24 dollars">
          <span class="dust" aria-hidden="true"></span>
        </label>
      </div>
      <span class="marble" aria-hidden="true"><span class="swirl"></span></span>
    </div>
    <div class="options" aria-hidden="true">
      <div class="opt" data-on><b>Standard</b><span>5 to 7 days</span><span>Free</span></div>
      <div class="opt"><b>Express</b><span>2 days</span><span>$9.00</span></div>
      <div class="opt"><b>Overnight</b><span>Tomorrow</span><span>$24.00</span></div>
    </div>
  </fieldset>
  <div class="totals" aria-live="polite">
    <span>Linen shirt, sand</span><span>$39.00</span>
    <span>Shipping</span><span class="ship">Free</span>
    <span class="sum">Total</span><span class="sum total">$39.00</span>
  </div>
</main>

<script src="../runtime/stringless.js"></script>
<script>
  const tray = document.querySelector('.tray');
  const marble = tray.querySelector('.marble');
  const swirl = marble.querySelector('.swirl');
  const wells = [...tray.querySelectorAll('.well')];
  const inputs = wells.map((w) => w.querySelector('input'));
  const opts = [...document.querySelectorAll('.opt')];
  const shipEl = document.querySelector('.ship');
  const totalEl = document.querySelector('.total');
  let current = inputs.findIndex((i) => i.checked);
  let x = 0, y = 0, spin = 0, rolling = null, nudge = null;

  // Layout offsets ignore the tray's tilt, so the marble always lands in the middle of the well.
  const centerOf = (i) => {
    const w = wells[i];
    const wrap = w.parentElement;
    return { x: wrap.offsetLeft + w.offsetLeft + w.offsetWidth / 2, y: wrap.offsetTop + w.offsetTop + w.offsetHeight / 2 + 3 };
  };
  const place = (px, py, rot) => {
    x = px; y = py; spin = rot;
    marble.style.translate = `${px.toFixed(1)}px ${py.toFixed(1)}px`;
    swirl.style.rotate = `${rot.toFixed(1)}deg`;
  };
  const rest = () => { const c = centerOf(current); place(c.x, c.y, spin); };
  rest();
  addEventListener('resize', rest);

  // Rehearsal: hovering or focusing another well tips the tray and starts the marble toward it.
  wells.forEach((w, i) => {
    w.addEventListener('sl:rehearse', () => {
      if (i === current || rolling) return;
      const dir = Math.sign(i - current);
      tray.style.setProperty('--tilt', String(dir));
      const from = centerOf(current);
      const to = centerOf(i);
      if (nudge) nudge.cancel();
      if (Stringless.reducedMotion) return;
      const k = 0.16 * Stringless.fluency.get('choose') < 1 ? 0.16 : 0.1;
      const dx = (to.x - from.x) * k;
      nudge = marble.animate([{ translate: `${from.x}px ${from.y}px` }, { translate: `${from.x + dx}px ${from.y - 2}px` }], { duration: 420, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'forwards' });
      swirl.animate([{ rotate: `${spin}deg` }, { rotate: `${spin + dx * 2.2}deg` }], { duration: 420, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'forwards' });
    });
    w.addEventListener('sl:leave', () => {
      tray.style.setProperty('--tilt', '0');
      if (nudge && !rolling) { nudge.reverse(); swirl.getAnimations().forEach((a) => a.reverse()); }
    });
  });

  inputs.forEach((input, i) => input.addEventListener('change', () => { if (input.checked) choose(i); }));

  async function choose(i) {
    if (i === current) return;
    const prev = current;
    current = i;
    tray.style.setProperty('--tilt', '0');
    opts.forEach((o, k) => o.toggleAttribute('data-on', k === i));
    const price = Number(inputs[i].value);
    shipEl.textContent = price ? `$${price.toFixed(2)}` : 'Free';
    totalEl.textContent = `$${(39 + price).toFixed(2)}`;

    const leftWrap = wells[prev].parentElement;
    leftWrap.setAttribute('data-left', '');
    setTimeout(() => leftWrap.removeAttribute('data-left'), 120);

    const from = { x, y };
    const to = centerOf(i);
    if (nudge) { nudge.cancel(); nudge = null; }
    swirl.getAnimations().forEach((a) => a.cancel());
    if (rolling) rolling.cancel();

    if (Stringless.reducedMotion) {
      place(to.x, to.y, spin);
      Stringless.verbs.crystallize(marble, { duration: 300 });
      return;
    }

    // Roll: over each ridge between wells with a small hop, then a damped glass bounce in the well.
    const steps = Math.abs(i - prev);
    const frames = [];
    const n = 24;
    for (let s = 0; s <= n; s++) {
      const t = s / n;
      const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const px = from.x + (to.x - from.x) * e;
      const hop = Math.abs(Math.sin(e * Math.PI * steps)) * 10;
      frames.push({ translate: `${px.toFixed(1)}px ${(from.y - hop).toFixed(1)}px`, offset: t * 0.82 });
    }
    frames.push({ translate: `${to.x}px ${to.y - 5}px`, offset: 0.9 });
    frames.push({ translate: `${to.x}px ${to.y}px`, offset: 0.95 });
    frames.push({ translate: `${to.x}px ${to.y - 1.5}px`, offset: 0.98 });
    frames.push({ translate: `${to.x}px ${to.y}px`, offset: 1 });
    const duration = 520 + steps * 260;
    const roll = (to.x - from.x) / 23 * (180 / Math.PI);
    rolling = marble.animate(frames, { duration, fill: 'forwards' });
    swirl.animate([{ rotate: `${spin}deg` }, { rotate: `${spin + roll}deg` }], { duration: duration * 0.85, easing: 'cubic-bezier(.45,0,.3,1)', fill: 'forwards' });
    setTimeout(() => Stringless.sound.play('glass'), duration * 0.9);
    await rolling.finished.catch(() => null);
    rolling.cancel();
    swirl.getAnimations().forEach((a) => a.cancel());
    rolling = null;
    place(to.x, to.y, spin + roll);
  }
</script>
</body>
</html>
